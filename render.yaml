# render.yaml — Render Blueprint for OVERHAUL monolith
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: overhaul
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VALIDATION_ADMIN_TOKEN
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: IMAGEN_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
